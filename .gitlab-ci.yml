image: python:3.8-alpine

stages:
  - dependencies
  - main_task
  - publish
  
# Caching can be used to store directories (like installed packages) between jobs.
cache:
  paths:
    - .venv/

# Here, a virtual environment is created and activated in the before_script stage, which runs before 
# every job's script section. The virtual environment directory (.venv here) is cached so that 
# it's available for subsequent jobs.
before_script:
  - python3 -m venv .venv
  - source .venv/bin/activate

dependencies:
  stage: dependencies
  script:
    - pip install -r $CI_PROJECT_DIR/requirements.txt
  
run_metadata_import:
  stage: main_task
  before_script:
    - apk add --no-cache bash 
  script:
    - pip install --cache-dir .pip_cache/ -r requirements.txt
    - echo "⚙️ Running main task"
    - python3 ./main.py -l DEBUG
    - |
      echo -e "\n\
      ✨ Execution finished"
  artifacts:
    expire_in: 4 weeks
  cache:
    paths:
      - .pip_cache/
    key: "${CI_COMMIT_REF_SLUG}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  timeout: 4h

build_and_push:
  image: docker:latest
  stage: publish
  services:
    - docker:dind
  only:
    - tags
  script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_PASSWORD"
    - docker build -t "$DOCKERHUB_USERNAME/opeb_tools_importer:$CI_COMMIT_TAG" -f Dockerfile .
    - docker push "$DOCKERHUB_USERNAME/opeb_tools_importer:$CI_COMMIT_TAG"
  after_script:
    - docker logout